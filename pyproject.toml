[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "computadora"
version = "0.1.0"
description = "Asistente personal de escritorio para Windows 11 con voz local e integraciones configurables"
requires-python = ">=3.10"
authors = [
    {name = "José Esaú Díaz Hernández"}
]

[tool.setuptools.packages.find]
include = ["computadora*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_functions = ["test_*"]
python_files = ["test_*.py", "smoke_*.py"]
